name: Maven CI
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SBB PR 235 code, read-only
        uses: actions/checkout@v4
        with:
          repository: SchweizerischeBundesbahnen/netzgrafik-editor-converter
          ref: 3eea15706b1ddd5edf4ba84ff8eb9f575adfbea6
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Inject isolated order-dependent metadata probes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/src/test/java/ch/sbb/pfi/netzgrafikeditor/converter/adapter/matsim/InfrastructureBuilderTest.java")
          s = p.read_text()
          anchor = "        @Test\n        void brokenTrackIsBuiltAsGivenWhenWarning() {"
          assert s.count(anchor) == 1, "Upstream test layout changed"
          injected = "        @Test\n        void sameSegmentMetadataFirstRouteWinsAFirst() {\n            TrackSegmentInfo a = new TrackSegmentInfo(\"J-D\", nodes.get(\"J\"), nodes.get(\"D\"), 1111);\n            a.getLinkAttributes().put(\"probe_source\", \"A\");\n            TrackSegmentInfo b = new TrackSegmentInfo(\"J-D\", nodes.get(\"J\"), nodes.get(\"D\"), 2222);\n            b.getLinkAttributes().put(\"probe_source\", \"B\");\n            track(\"A\", \"D\", segment(\"A-J\", \"A\", \"J\"), a);\n            track(\"B\", \"D\", segment(\"B-J\", \"B\", \"J\"), b);\n            InfrastructureBuilder builder = build(ValidationStrategy.FAIL_ON_ISSUES, \"A>D\", \"B>D\");\n            assertDoesNotThrow(builder::handleTrackIssues);\n            assertRoutesAreContinuous();\n            Link link = scenario.getNetwork().getLinks().get(Id.createLinkId(\"track_link_J-D\"));\n            System.out.println(\"ORDER_PROBE A-first length=\" + link.getLength() + \" source=\" + link.getAttributes().getAttribute(\"probe_source\"));\n            assertEquals(1111, link.getLength());\n            assertEquals(\"A\", link.getAttributes().getAttribute(\"probe_source\"));\n        }\n\n        @Test\n        void sameSegmentMetadataFirstRouteWinsBFirst() {\n            TrackSegmentInfo a = new TrackSegmentInfo(\"J-D\", nodes.get(\"J\"), nodes.get(\"D\"), 1111);\n            a.getLinkAttributes().put(\"probe_source\", \"A\");\n            TrackSegmentInfo b = new TrackSegmentInfo(\"J-D\", nodes.get(\"J\"), nodes.get(\"D\"), 2222);\n            b.getLinkAttributes().put(\"probe_source\", \"B\");\n            track(\"A\", \"D\", segment(\"A-J\", \"A\", \"J\"), a);\n            track(\"B\", \"D\", segment(\"B-J\", \"B\", \"J\"), b);\n            InfrastructureBuilder builder = build(ValidationStrategy.FAIL_ON_ISSUES, \"B>D\", \"A>D\");\n            assertDoesNotThrow(builder::handleTrackIssues);\n            assertRoutesAreContinuous();\n            Link link = scenario.getNetwork().getLinks().get(Id.createLinkId(\"track_link_J-D\"));\n            System.out.println(\"ORDER_PROBE B-first length=\" + link.getLength() + \" source=\" + link.getAttributes().getAttribute(\"probe_source\"));\n            assertEquals(2222, link.getLength());\n            assertEquals(\"B\", link.getAttributes().getAttribute(\"probe_source\"));\n        }\n\n"
          p.write_text(s.replace(anchor, injected + anchor))
          PY
      - name: Run original tests and metadata probes
        run: mvn --batch-mode test --file pom.xml -pl lib -am -Dtest=InfrastructureBuilderTest -Dsurefire.failIfNoSpecifiedTests=false
